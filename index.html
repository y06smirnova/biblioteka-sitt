<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #125c5f;
            --green-dark: #0d4547;
            --green-light: #1a7a7e;
            --green-lighter: #208f94;
            --gold: #b8a57a;
            --gold-light: #d4c9a8;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
            --white: #ffffff;
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --section-hover: #f9fbfb;
            --border-light: rgba(184, 165, 122, 0.3);
        }

        body.dark {
            --green: #208f94;
            --green-dark: #1a7a7e;
            --green-light: #125c5f;
            --green-lighter: #28a0a5;
            --gold: #9e8b5c;
            --gold-light: #6b5d3e;
            --text: #e0dcd0;
            --text-light: #b0a890;
            --white: #1e1e1e;
            --bg: #151515;
            --card-bg: #1e1e1e;
            --section-hover: #252525;
            --border-light: rgba(158, 139, 92, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: var(--bg);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(18, 92, 95, 0.08) 39px, rgba(18, 92, 95, 0.08) 40px),
                repeating-linear-gradient(0deg, transparent, transparent 119px, rgba(18, 92, 95, 0.12) 119px, rgba(18, 92, 95, 0.12) 120px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 199px, rgba(18, 92, 95, 0.06) 199px, rgba(18, 92, 95, 0.06) 200px, transparent 200px, transparent 399px, rgba(18, 92, 95, 0.06) 399px, rgba(18, 92, 95, 0.06) 400px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 49px, rgba(18, 92, 95, 0.04) 49px, rgba(18, 92, 95, 0.04) 50px, transparent 50px, transparent 349px, rgba(18, 92, 95, 0.04) 349px, rgba(18, 92, 95, 0.04) 350px),
                linear-gradient(135deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%),
                linear-gradient(45deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%);
            background-size: 400px 200px;
            background-position: center top;
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--green);
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--gold-light);
        }

        .search-box {
            width: 100%;
            padding: 0.5rem 0.8rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.95rem;
            border: 1px solid var(--green);
            border-radius: 3px;
            background: transparent;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box::placeholder { color: var(--text-light); font-style: italic; }
        .search-box:focus { border-color: var(--green-light); }
        .search-info { color: var(--text-light); font-size: 0.8rem; margin-bottom: 0.8rem; font-style: italic; min-height: 1rem; }

        .section {
            background: transparent;
            border: none;
            border-left: 3px solid var(--green);
            border-radius: 0;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }
        .section:hover { background: var(--section-hover); border-left-color: var(--green-light); }
        .section h2 {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.6px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .section h2::before { content: '▸'; color: var(--green); font-size: 1rem; }
        .section .desc { color: var(--text-light); font-size: 0.9rem; margin-top: 0.15rem; }
        .section-content { display: none; margin-top: 0.8rem; padding-left: 1.2rem; border-left: 1px solid var(--gold-light); }
        .section-content.active { display: block; }

        .subfolder {
            background: transparent;
            border: none;
            border-left: 2px solid var(--gold);
            border-radius: 0;
            padding: 0.6rem 0.8rem;
            margin: 0.3rem 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .subfolder:hover { background: #fdfdfb; }
        .subfolder h3 { font-size: 1rem; font-weight: 400; color: var(--text); }
        .subfolder h3::before { content: '▹ '; color: var(--gold); }
        .subfolder-content { display: none; margin-top: 0.4rem; padding-left: 1rem; border-left: 1px solid var(--border-light); }
        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0;
            border-bottom: 1px dotted var(--border-light);
            font-size: 0.9rem;
        }
        .file-item .name { flex: 1; color: var(--text); }
        .file-item .name::before { content: '— '; color: var(--green); }
        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
            transition: all 0.2s;
            background: transparent;
            white-space: nowrap;
        }
        .download-link:hover { background: var(--green); color: var(--white); }
        .empty-message { color: var(--text-light); font-style: italic; padding: 0.4rem 0; font-size: 0.9rem; }
        .loading { text-align: center; color: var(--text-light); padding: 1rem; font-style: italic; }

        .corner-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--green);
            color: var(--green);
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            line-height: 1;
        }
        .corner-btn:hover { background: var(--green); color: var(--white); }

        .auth-overlay {
            display: flex;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .auth-box h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--green);
            margin-bottom: 1rem;
        }
        .auth-box p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .yandex-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #fc3f1d;
            color: #fff;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 4px;
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .yandex-login-btn:hover { background: #e63615; }
        .logout-btn {
            display: inline-block;
            margin-left: 0.5rem;
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            border: none;
            background: none;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <button class="corner-btn" id="themeToggle" title="День / Ночь" onclick="toggleTheme()">◐</button>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h2>Доступ к библиотеке</h2>
            <p>Войдите через Яндекс, чтобы получить доступ к файлам.</p>
            <a class="yandex-login-btn" id="yandexLoginBtn" href="#">Войти через Яндекс</a>
        </div>
    </div>

    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии <button class="logout-btn" onclick="logout()">Выйти</button></h1>
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск по файлам и папкам..." oninput="filterLibrary()">
        <div class="search-info" id="searchInfo"></div>
        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
    </div>

    <script>
        const YANDEX_TOKEN = 'y0__wgBEPWSg8UGGKWjQyDRt-rtF1fZk7kEBGBv5Rk3hMVs5-xKpuQX';
        const YANDEX_API = 'https://cloud-api.yandex.net/v1/disk/resources';
        const ROOT_PATH = '/Библиотека';
        const AUTH_CLIENT_ID = '8e6fb6fe7c75492698730f78184a1290';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';
        
        const ALLOWED_EMAILS = ['y066mirnova@yandex.ru'];

        const sectionDescriptions = {
            '1. Проектная документация (технология)': 'Шаблоны для создания графической и текстовой документации : чертежи общего вида, монтировочная опись, лист развески',
            '2. Проектная документация (свет)': 'LightPlot, системы управления, элементы электробутафории',
            '3. Рабочая документация': 'Стандартные изделия, механика',
            '4. Гастрольная документация': 'Технический райдер, распределение груза',
            '5. Расчёт театральных конструкций': 'Расчёты ферм, станков, лестниц, каркасов',
            '6. 3D-моделирование и визуализация': 'Аддоны для Blender и Cinema-4D',
            '7. Организация театрального дела': 'Сметы по спектаклям, нормативные документы'
        };

        function naturalSort(a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }); }
        function toggleElement(id) { const el = document.getElementById(id); if (el) el.classList.toggle('active'); }

        function getAccessTokenFromHash() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            return params.get('access_token');
        }

        function saveToken(token) {
            localStorage.setItem('yandex_auth_token', token);
            localStorage.setItem('yandex_auth_time', Date.now());
        }

        function getSavedToken() {
            const token = localStorage.getItem('yandex_auth_token');
            const time = localStorage.getItem('yandex_auth_time');
            if (token && time && (Date.now() - parseInt(time)) < 23 * 60 * 60 * 1000) return token;
            return null;
        }

        async function getUserInfo(token) {
            const response = await fetch('https://login.yandex.ru/info?format=json', {
                headers: { 'Authorization': `OAuth ${token}` }
            });
            if (!response.ok) throw new Error('Ошибка');
            return response.json();
        }

        function showAuthOverlay() {
            document.getElementById('authOverlay').style.display = 'flex';
            document.querySelector('.container').style.display = 'none';
            document.getElementById('themeToggle').style.display = 'none';
        }

        function hideAuthOverlay() {
            document.getElementById('authOverlay').style.display = 'none';
            document.querySelector('.container').style.display = '';
            document.getElementById('themeToggle').style.display = '';
        }

        function logout() {
            localStorage.removeItem('yandex_auth_token');
            localStorage.removeItem('yandex_auth_time');
            window.location.hash = '';
            showAuthOverlay();
        }

        async function checkAuth() {
            const token = getAccessTokenFromHash() || getSavedToken();
            if (token) {
                saveToken(token);
                if (window.location.hash) window.location.hash = '';
                try {
                    const userInfo = await getUserInfo(token);
                    const email = userInfo.default_email || userInfo.emails?.[0];
                    if (email && ALLOWED_EMAILS.includes(email.toLowerCase())) {
                        hideAuthOverlay();
                        loadLibrary();
                        return;
                    } else {
                        alert('Доступ запрещён.');
                        logout();
                        return;
                    }
                } catch (e) {
                    alert('Ошибка авторизации.');
                    logout();
                    return;
                }
            }
            showAuthOverlay();
            document.getElementById('yandexLoginBtn').href = `https://oauth.yandex.ru/authorize?response_type=token&client_id=${AUTH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
        }

        async function fetchFromYandex(path) {
            const url = `${YANDEX_API}?path=${encodeURIComponent(path)}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `OAuth ${YANDEX_TOKEN}` }
            });
            if (!response.ok) throw new Error(`Ошибка ${response.status}`);
            return response.json();
        }

        async function getDownloadUrl(path) {
            const apiUrl = `${YANDEX_API}/download?path=${encodeURIComponent(path)}`;
            const response = await fetch(apiUrl, {
                headers: { 'Authorization': `OAuth ${YANDEX_TOKEN}` }
            });
            if (!response.ok) throw new Error('Ошибка');
            const data = await response.json();
            return PROXY_URL + encodeURIComponent(data.href);
        }

        function renderFiles(files) {
            if (!files.length) return '';
            const sorted = [...files].sort(naturalSort);
            return sorted.map(f => `
                <div class="file-item" data-filename="${f.name.toLowerCase()}">
                    <span class="name">${f.name}</span>
                    <a href="${f.downloadUrl || '#'}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        async function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            let inner = '';
            
            try {
                const data = await fetchFromYandex(section.path);
                const items = data._embedded?.items || [];
                const subfolders = items.filter(i => i.type === 'dir');
                const files = items.filter(i => i.type === 'file');
                
                for (const sub of subfolders) {
                    const subId = 'sub-' + index + '-' + sub.name.replace(/[^a-zA-Zа-яА-Я0-9]/g, '-');
                    let subInner = '<div class="empty-message">Пусто</div>';
                    try {
                        const subData = await fetchFromYandex(sub.path);
                        const subFiles = (subData._embedded?.items || []).filter(i => i.type === 'file');
                        if (subFiles.length > 0) {
                            const filesWithLinks = await Promise.all(subFiles.map(async f => ({
                                name: f.name,
                                downloadUrl: await getDownloadUrl(f.path)
                            })));
                            subInner = renderFiles(filesWithLinks);
                        }
                    } catch (e) {}
                    
                    inner += `
                        <div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')" data-foldername="${sub.name.toLowerCase()}">
                            <h3>${sub.name}</h3>
                            <div id="${subId}" class="subfolder-content">${subInner}</div>
                        </div>
                    `;
                }
                
                if (files.length > 0) {
                    const filesWithLinks = await Promise.all(files.map(async f => ({
                        name: f.name,
                        downloadUrl: await getDownloadUrl(f.path)
                    })));
                    inner += renderFiles(filesWithLinks);
                }
            } catch (e) {
                inner = '<div class="empty-message">Ошибка загрузки</div>';
            }
            
            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';
            
            return `
                <div class="section" onclick="toggleElement('${sectionId}')" data-sectionname="${section.name.toLowerCase()}">
                    <h2>${section.name}</h2>
                    <p class="desc">${desc}</p>
                    <div id="${sectionId}" class="section-content">${inner}</div>
                </div>
            `;
        }

        function filterLibrary() {
            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            const sections = document.querySelectorAll('.section');
            const searchInfo = document.getElementById('searchInfo');
            let visibleCount = 0;
            sections.forEach(section => {
                if (!query) {
                    section.style.display = '';
                    section.querySelectorAll('.file-item, .subfolder').forEach(el => el.style.display = '');
                    searchInfo.textContent = '';
                    return;
                }
                const sectionName = section.getAttribute('data-sectionname') || '';
                const fileItems = section.querySelectorAll('.file-item');
                const subfolders = section.querySelectorAll('.subfolder');
                let hasVisibleFiles = false;
                fileItems.forEach(item => {
                    const filename = item.getAttribute('data-filename') || '';
                    if (filename.includes(query) || sectionName.includes(query)) { item.style.display = ''; hasVisibleFiles = true; }
                    else { item.style.display = 'none'; }
                });
                subfolders.forEach(sub => {
                    const folderName = sub.getAttribute('data-foldername') || '';
                    const subFiles = sub.querySelectorAll('.file-item');
                    let subHasVisible = folderName.includes(query);
                    subFiles.forEach(item => {
                        const filename = item.getAttribute('data-filename') || '';
                        if (filename.includes(query) || folderName.includes(query) || sectionName.includes(query)) { item.style.display = ''; subHasVisible = true; }
                        else { item.style.display = 'none'; }
                    });
                    sub.style.display = subHasVisible ? '' : 'none';
                    if (subHasVisible) hasVisibleFiles = true;
                });
                if (hasVisibleFiles || sectionName.includes(query)) { section.style.display = ''; visibleCount++; }
                else { section.style.display = 'none'; }
            });
            searchInfo.textContent = query ? (visibleCount > 0 ? `Найдено в ${visibleCount} разделах` : 'Ничего не найдено') : '';
        }

        async function loadLibrary() {
            const container = document.getElementById('sections-container');
            try {
                const rootData = await fetchFromYandex(ROOT_PATH);
                const sections = (rootData._embedded?.items || []).filter(i => i.type === 'dir' && !i.name.startsWith('Игра -'));
                
                if (!sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены.</div>';
                    return;
                }
                
                container.innerHTML = '<div class="loading">Загрузка разделов...</div>';
                const htmlParts = await Promise.all(sections.map((s, i) => renderSection(s, i)));
                container.innerHTML = htmlParts.join('');
            } catch (e) {
                container.innerHTML = `<div class="loading">Ошибка: ${e.message}. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>`;
            }
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) { btn.textContent = '◑'; localStorage.setItem('theme', 'dark'); }
            else { btn.textContent = '◐'; localStorage.setItem('theme', 'light'); }
        }
        function loadTheme() {
            const saved = localStorage.getItem('theme');
            const btn = document.getElementById('themeToggle');
            if (saved === 'dark') { document.body.classList.add('dark'); btn.textContent = '◑'; }
            else { btn.textContent = '◐'; }
        }

        loadTheme();
        checkAuth();
    </script>
</body>
</html>
