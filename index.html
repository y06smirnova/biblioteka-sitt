<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #125c5f;
            --green-dark: #0d4547;
            --green-light: #1a7a7e;
            --green-lighter: #208f94;
            --green-bg: #e8f2f2;
            --green-bg-hover: #d4e8e8;
            --gold: #b8a57a;
            --gold-light: #d4c9a8;
            --paper: #fdfaf5;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: #0e494b;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(184, 165, 122, 0.05) 19px, rgba(184, 165, 122, 0.05) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(184, 165, 122, 0.05) 19px, rgba(184, 165, 122, 0.05) 20px);
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--white);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .container::before {
            content: '';
            display: block;
            height: 3px;
            background: linear-gradient(90deg, var(--green), var(--gold), var(--green));
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--green);
        }

        .section {
            background: var(--green-bg);
            border: 2px solid var(--green);
            border-left: 6px solid var(--green);
            border-radius: 4px;
            padding: 1.1rem 1.4rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 6px rgba(18, 92, 95, 0.1);
        }

        .section:hover {
            background: var(--green-bg-hover);
            box-shadow: 0 4px 12px rgba(18, 92, 95, 0.2);
        }

        .section h2 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .section h2::before {
            content: '▸';
            color: var(--green);
            font-size: 1.2rem;
        }

        .section .desc {
            color: var(--green-light);
            font-size: 0.95rem;
            margin-top: 0.25rem;
            font-weight: 400;
        }

        .section-content {
            display: none;
            margin-top: 1rem;
            padding-left: 1.2rem;
            border-left: 3px solid var(--green);
        }

        .section-content.active { display: block; }

        .subfolder {
            background: var(--white);
            border: 1px solid var(--green);
            border-left: 4px solid var(--gold);
            border-radius: 3px;
            padding: 0.8rem 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 3px rgba(18, 92, 95, 0.05);
        }

        .subfolder:hover {
            background: #f5f7f5;
            box-shadow: 0 2px 6px rgba(18, 92, 95, 0.1);
        }

        .subfolder h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--green-dark);
        }

        .subfolder h3::before {
            content: '▹ ';
            color: var(--gold);
        }

        .subfolder-content {
            display: none;
            margin-top: 0.5rem;
            padding-left: 1rem;
            border-left: 2px solid var(--gold-light);
        }

        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--gold-light);
            font-size: 0.95rem;
        }

        .file-item .name {
            flex: 1;
            color: var(--text);
            font-weight: 400;
        }

        .file-item .name::before {
            content: '— ';
            color: var(--green);
            font-weight: bold;
        }

        .download-link {
            color: var(--white);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 14px;
            background: var(--green);
            border: 2px solid var(--green);
            border-radius: 3px;
            transition: all 0.2s;
        }

        .download-link:hover {
            background: var(--green-lighter);
            border-color: var(--green-lighter);
            color: var(--white);
        }

        .empty-message { color: var(--text-light); font-style: italic; padding: 0.4rem 0; }
        .loading { text-align: center; color: var(--green-light); padding: 1rem; font-style: italic; }
        .note {
            margin-top: 2rem;
            font-style: italic;
            color: var(--text-light);
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid var(--gold-light);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>
        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
        <p class="note">Добавьте файл или папку на Google Диск — и они появятся здесь автоматически.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnjiqKWznABpb_vB9os9kR8P-8Df3-AEH-KFjdVX1NLje3Svu9COWTdzZ1HPPOkj3CIw/exec';
        
        const PROXY_URLS = [
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(SCRIPT_URL),
            'https://corsproxy.io/?' + encodeURIComponent(SCRIPT_URL)
        ];

        const sectionDescriptions = {
            '1. Проектная документация (технология)': 'Планировки, разрезы, монтажные листы, ведомости декораций.',
            '2. Проектная документация (свет)': 'Световые карты, паспорта приборов, схемы подвеса.',
            '3. Рабочая документация': 'Чертежи узлов, деталировочные листы, спецификации материалов.',
            '4. Гастрольная документация': 'Технический райдер, схемы застройки, паспорта площадок.',
            '5. Расчёт театральных конструкций': 'Нагрузки, подбор сечений, примеры расчётов ферм и балок.',
            '6. 3D-моделирование и визуализация': '3D-модели, визуализации, сцены.',
            '7. Организация театрального дела': 'Должностные инструкции, графики выпуска спектакля, нормативы.'
        };

        function toggleElement(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active');
        }

        function renderFiles(files) {
            if (!files.length) return '<div class="empty-message">Нет файлов</div>';
            return files.map(f => `
                <div class="file-item">
                    <span class="name">${f.name}</span>
                    <a href="${f.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            
            let inner = '';
            
            (section.folders || []).forEach((sub, si) => {
                const subId = 'sub-' + index + '-' + si;
                inner += `
                    <div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')">
                        <h3>${sub.name}</h3>
                        <div id="${subId}" class="subfolder-content">
                            ${renderFiles(sub.files || [])}
                        </div>
                    </div>
                `;
            });
            
            inner += renderFiles(section.files || []);

            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';

            return `
                <div class="section" onclick="toggleElement('${sectionId}')">
                    <h2>${section.name}</h2>
                    <p class="desc">${desc}</p>
                    <div id="${sectionId}" class="section-content">${inner}</div>
                </div>
            `;
        }

        // Функция для очистки JSONP-обёртки (убирает callback(...))
        function unwrapJSONP(text) {
            // Ищем содержимое между первой открывающей скобкой и последней закрывающей
            const start = text.indexOf('(');
            const end = text.lastIndexOf(')');
            if (start !== -1 && end !== -1 && start < end) {
                return text.substring(start + 1, end);
            }
            return text; // Если не нашли — возвращаем как есть
        }

        async function tryFetchWithProxies(urls) {
            for (const url of urls) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    let text = await response.text();
                    // Пробуем убрать JSONP-обёртку
                    text = unwrapJSONP(text);
                    const data = JSON.parse(text);
                    return data;
                } catch (e) {
                    continue;
                }
            }
            throw new Error('Все прокси недоступны');
        }

        async function loadLibrary() {
            const container = document.getElementById('sections-container');
            try {
                const sections = await tryFetchWithProxies(PROXY_URLS);
                if (!sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены. Проверьте структуру Google Диска.</div>';
                    return;
                }
                container.innerHTML = sections.map((s, i) => renderSection(s, i)).join('');
            } catch (e) {
                container.innerHTML = `<div class="loading">Ошибка загрузки: ${e.message}. Попробуйте обновить страницу.</div>`;
            }
        }

        loadLibrary();
    </script>
</body>
</html>
