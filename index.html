<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #082924;
            --green-hover: #0b3b33;
            --gold: #b8a57a;
            --paper: #fdfaf5;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: #f5f2eb;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(184, 165, 122, 0.08) 19px, rgba(184, 165, 122, 0.08) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(184, 165, 122, 0.08) 19px, rgba(184, 165, 122, 0.08) 20px);
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--paper);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--gold);
            margin-bottom: 2rem;
            opacity: 0.6;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(184, 165, 122, 0.35);
        }

        /* Основной раздел */
        .section {
            background: #fffefb;
            border: 1px solid #e5ded0;
            border-left: 4px solid var(--green);
            border-radius: 2px;
            padding: 1.1rem 1.4rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }

        .section:hover {
            background: #f9f6f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section h2 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .section h2::before {
            content: '▸';
            display: inline-block;
            color: var(--green);
            font-size: 1.1rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .section .desc {
            margin-top: 0.25rem;
            color: var(--text-light);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .section-content {
            display: none;
            margin-top: 1rem;
            padding-left: 1.2rem;
            border-left: 2px solid rgba(184, 165, 122, 0.3);
        }

        .section-content.active {
            display: block;
        }

        /* Вложенная папка */
        .subfolder {
            background: #faf8f2;
            border: 1px solid #e0d8c0;
            border-left: 3px solid var(--gold);
            border-radius: 2px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .subfolder:hover {
            background: #f5f0e5;
        }

        .subfolder h3 {
            font-size: 1.05rem;
            font-weight: 400;
            color: #5e4a2e;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .subfolder h3::before {
            content: '▹';
            color: var(--gold);
            font-size: 1rem;
        }

        .subfolder-content {
            display: none;
            margin-top: 0.6rem;
            padding-left: 1rem;
            border-left: 2px solid rgba(184, 165, 122, 0.2);
        }

        .subfolder-content.active {
            display: block;
        }

        /* Файлы */
        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #e0d7c6;
            font-size: 0.95rem;
        }

        .file-item .name {
            flex: 1;
            color: #3d3d3d;
        }

        .file-item .name::before {
            content: '— ';
            color: var(--gold);
            font-weight: bold;
            margin-right: 0.3rem;
        }

        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
            transition: background 0.15s, color 0.15s;
            background: transparent;
            white-space: nowrap;
        }

        .download-link:hover {
            background: var(--green-hover);
            color: #fff;
        }

        .empty-message {
            color: #b0a590;
            font-style: italic;
            padding: 0.4rem 0;
        }

        .loading {
            text-align: center;
            color: #9a9488;
            padding: 1rem;
            font-style: italic;
        }

        .note {
            margin-top: 2rem;
            font-style: italic;
            color: #9a9488;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>

        <div id="sections-container">
            <div class="loading">Загрузка библиотеки...</div>
        </div>

        <p class="note">Файлы автоматически подгружаются из облачного хранилища.<br>Добавьте новый файл или папку на Google Диске — и они появятся здесь.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQg3qTxnDcjdc4kUe77Z-P2bBLMOfCSoXJZZ49-SgeTquqhAmpwLErahilccx6gY26jw/exec';

        const sectionDescriptions = {
            'Проектная документация(технологическая разработка спектакля)': 'Планировки, разрезы, монтажные листы, ведомости декораций.',
            'Проектная документация (художник-технолог сцены)': 'Планы сцены, разрезы, монтажные листы, ведомости декораций.',
            'Проектная документация (художник по свету)': 'Световые карты, паспорта приборов, схемы подвеса.',
            'Рабочая документация': 'Чертежи узлов, деталировочные листы, спецификации материалов.',
            'Гастрольная документация': 'Технический райдер, схемы застройки, паспорта площадок.',
            'Расчёт театральных конструкций': 'Нагрузки, подбор сечений, примеры расчётов ферм и балок.',
            'Организация театрального дела': 'Должностные инструкции, графики выпуска спектакля, нормативы.'
        };

        // Генератор уникальных ID
        function generateId(prefix) {
            return prefix + '-' + Math.random().toString(36).substring(2, 10);
        }

        // Отрисовка списка файлов
        function renderFiles(files) {
            if (!files || files.length === 0) {
                return '<div class="empty-message">Нет файлов</div>';
            }
            return files.map(file => `
                <div class="file-item">
                    <span class="name">${file.name}</span>
                    <a href="${file.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        // Отрисовка вложенной папки (рекурсивно)
        function renderSubfolder(folder) {
            const subfolderContentId = generateId('subfolder-content');
            
            let innerHTML = '';
            // Файлы в этой папке
            if (folder.files && folder.files.length > 0) {
                innerHTML += renderFiles(folder.files);
            }
            // Вложенные папки
            if (folder.folders && folder.folders.length > 0) {
                folder.folders.forEach(sub => {
                    innerHTML += renderSubfolder(sub);
                });
            }
            if (!innerHTML) {
                innerHTML = '<div class="empty-message">Пусто</div>';
            }

            return `
                <div class="subfolder" onclick="event.stopPropagation(); toggleSubfolder('${subfolderContentId}')">
                    <h3>${folder.name}</h3>
                    <div id="${subfolderContentId}" class="subfolder-content">
                        ${innerHTML}
                    </div>
                </div>
            `;
        }

        // Отрисовка основного раздела
        function renderSection(section) {
            const sectionContentId = generateId('section-content');
            const description = sectionDescriptions[section.name] || 'Материалы раздела.';
            
            let innerHTML = '';
            // Вложенные папки
            if (section.folders && section.folders.length > 0) {
                section.folders.forEach(folder => {
                    innerHTML += renderSubfolder(folder);
                });
            }
            // Файлы в корне раздела
            if (section.files && section.files.length > 0) {
                innerHTML += renderFiles(section.files);
            }
            if (!innerHTML) {
                innerHTML = '<div class="empty-message">Раздел пуст</div>';
            }

            return `
                <div class="section" onclick="toggleSection('${sectionContentId}')">
                    <h2>${section.name}</h2>
                    <p class="desc">${description}</p>
                    <div id="${sectionContentId}" class="section-content">
                        ${innerHTML}
                    </div>
                </div>
            `;
        }

        // Переключение видимости раздела
        function toggleSection(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const isActive = el.classList.contains('active');
            // Закрываем все разделы
            document.querySelectorAll('.section-content').forEach(f => f.classList.remove('active'));
            if (!isActive) {
                el.classList.add('active');
            }
        }

        // Переключение видимости вложенной папки
        function toggleSubfolder(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active');
        }

        // Загрузка библиотеки
        async function loadLibrary() {
            const container = document.getElementById('sections-container');
            
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) {
                    throw new Error(`Ошибка ${response.status}`);
                }
                const sections = await response.json();

                if (sections.length === 0) {
                    container.innerHTML = '<div class="loading">Папки не найдены. Проверьте структуру Google Диска.</div>';
                    return;
                }

                container.innerHTML = sections.map(section => renderSection(section)).join('');
            } catch (error) {
                container.innerHTML = `<div class="loading">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        loadLibrary();
    </script>
</body>
</html>
