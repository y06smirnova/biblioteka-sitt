<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #082924;
            --green-hover: #0b3b33;
            --gold: #b8a57a;
            --paper: #fdfaf5;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: #f5f2eb;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(184, 165, 122, 0.08) 19px, rgba(184, 165, 122, 0.08) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(184, 165, 122, 0.08) 19px, rgba(184, 165, 122, 0.08) 20px);
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--paper);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--gold);
            margin-bottom: 2rem;
            opacity: 0.6;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(184, 165, 122, 0.35);
        }

        .section {
            background: #fffefb;
            border: 1px solid #e5ded0;
            border-left: 4px solid var(--green);
            border-radius: 2px;
            padding: 1.1rem 1.4rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .section:hover { background: #f9f6f0; }

        .section h2 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            color: var(--green);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .section h2::before {
            content: '▸';
            color: var(--green);
            font-size: 1.1rem;
        }

        .section .desc {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .section-content {
            display: none;
            margin-top: 1rem;
            padding-left: 1.2rem;
            border-left: 2px solid rgba(184, 165, 122, 0.3);
        }

        .section-content.active { display: block; }

        .subfolder {
            background: #faf8f2;
            border: 1px solid #e0d8c0;
            border-left: 3px solid var(--gold);
            border-radius: 2px;
            padding: 0.8rem 1rem;
            margin: 0.5rem 0;
            cursor: pointer;
        }

        .subfolder h3 {
            font-size: 1.05rem;
            font-weight: 400;
            color: #5e4a2e;
        }

        .subfolder h3::before {
            content: '▹ ';
            color: var(--gold);
        }

        .subfolder-content {
            display: none;
            margin-top: 0.5rem;
            padding-left: 1rem;
            border-left: 2px solid rgba(184, 165, 122, 0.2);
        }

        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed #e0d7c6;
            font-size: 0.95rem;
        }

        .file-item .name { flex: 1; color: #3d3d3d; }
        .file-item .name::before {
            content: '— ';
            color: var(--gold);
            font-weight: bold;
        }

        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            padding: 2px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
        }

        .download-link:hover {
            background: var(--green-hover);
            color: #fff;
        }

        .empty-message { color: #b0a590; font-style: italic; padding: 0.4rem 0; }
        .loading { text-align: center; color: #9a9488; padding: 1rem; font-style: italic; }
        .note { margin-top: 2rem; font-style: italic; color: #9a9488; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>
        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
        <p class="note">Добавьте файл или папку на Google Диск — и они появятся здесь автоматически.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQg3qTxnDcjdc4kUe77Z-P2bBLMOfCSoXJZZ49-SgeTquqhAmpwLErahilccx6gY26jw/exec';

        const sectionDescriptions = {
            'Проектная документация(технологическая разработка спектакля)': 'Планировки, разрезы, монтажные листы, ведомости декораций.',
        };

        function toggleElement(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active');
        }

        function renderFiles(files) {
            if (!files.length) return '<div class="empty-message">Нет файлов</div>';
            return files.map(f => `
                <div class="file-item">
                    <span class="name">${f.name}</span>
                    <a href="${f.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            
            let inner = '';
            
            // Подпапки
            (section.folders || []).forEach((sub, si) => {
                const subId = 'sub-' + index + '-' + si;
                inner += `
                    <div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')">
                        <h3>${sub.name}</h3>
                        <div id="${subId}" class="subfolder-content">
                            ${renderFiles(sub.files || [])}
                        </div>
                    </div>
                `;
            });
            
            // Файлы
            inner += renderFiles(section.files || []);

            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';

            return `
                <div class="section" onclick="toggleElement('${sectionId}')">
                    <h2>${section.name}</h2>
                    <p class="desc">${desc}</p>
                    <div id="${sectionId}" class="section-content">${inner}</div>
                </div>
            `;
        }

        async function loadLibrary() {
            const container = document.getElementById('sections-container');
            try {
                const res = await fetch(SCRIPT_URL);
                if (!res.ok) throw new Error('Ошибка ' + res.status);
                const sections = await res.json();
                if (!sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены.</div>';
                    return;
                }
                container.innerHTML = sections.map((s, i) => renderSection(s, i)).join('');
            } catch (e) {
                container.innerHTML = `<div class="loading">Ошибка: ${e.message}</div>`;
            }
        }

        loadLibrary();
    </script>
</body>
</html>
