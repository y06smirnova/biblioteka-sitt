<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #125c5f;
            --green-dark: #0d4547;
            --green-light: #1a7a7e;
            --green-lighter: #208f94;
            --green-bg: #f5f9f9;
            --gold: #b8a57a;
            --gold-light: #d4c9a8;
            --paper: #fdfaf5;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
            --white: #ffffff;
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --section-hover: #f9fbfb;
            --subfolder-hover: #fdfdfb;
            --border-light: rgba(184, 165, 122, 0.3);
        }

        body.dark {
            --green: #208f94;
            --green-dark: #1a7a7e;
            --green-light: #125c5f;
            --green-lighter: #28a0a5;
            --green-bg: #1a2a2a;
            --gold: #9e8b5c;
            --gold-light: #6b5d3e;
            --paper: #2c2c2c;
            --text: #e0dcd0;
            --text-light: #b0a890;
            --white: #1e1e1e;
            --bg: #151515;
            --card-bg: #1e1e1e;
            --section-hover: #252525;
            --subfolder-hover: #252525;
            --border-light: rgba(158, 139, 92, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: var(--bg);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(18, 92, 95, 0.08) 39px, rgba(18, 92, 95, 0.08) 40px),
                repeating-linear-gradient(0deg, transparent, transparent 119px, rgba(18, 92, 95, 0.12) 119px, rgba(18, 92, 95, 0.12) 120px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 199px, rgba(18, 92, 95, 0.06) 199px, rgba(18, 92, 95, 0.06) 200px, transparent 200px, transparent 399px, rgba(18, 92, 95, 0.06) 399px, rgba(18, 92, 95, 0.06) 400px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 49px, rgba(18, 92, 95, 0.04) 49px, rgba(18, 92, 95, 0.04) 50px, transparent 50px, transparent 349px, rgba(18, 92, 95, 0.04) 349px, rgba(18, 92, 95, 0.04) 350px),
                linear-gradient(135deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%),
                linear-gradient(45deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%);
            background-size: 400px 200px;
            background-position: center top;
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--green);
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--gold-light);
        }

        .search-box {
            width: 100%;
            padding: 0.5rem 0.8rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.95rem;
            border: 1px solid var(--green);
            border-radius: 3px;
            background: transparent;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box::placeholder { color: var(--text-light); font-style: italic; }
        .search-box:focus { border-color: var(--green-light); }

        .search-info {
            color: var(--text-light);
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
            font-style: italic;
            min-height: 1rem;
        }

        .section {
            background: transparent;
            border: none;
            border-left: 3px solid var(--green);
            border-radius: 0;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }

        .section:hover {
            background: var(--section-hover);
            border-left-color: var(--green-light);
        }

        .section h2 {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.6px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .section h2::before {
            content: '▸';
            color: var(--green);
            font-size: 1rem;
            font-weight: 400;
        }

        .section .desc {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 0.15rem;
            font-weight: 400;
        }

        .section-content {
            display: none;
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            border-left: 1px solid var(--gold-light);
        }

        .section-content.active { display: block; }

        .subfolder {
            background: transparent;
            border: none;
            border-left: 2px solid var(--gold);
            border-radius: 0;
            padding: 0.6rem 0.8rem;
            margin: 0.3rem 0;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }

        .subfolder:hover {
            background: var(--subfolder-hover);
            border-left-color: var(--green);
        }

        .subfolder h3 {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
        }

        .subfolder h3::before {
            content: '▹ ';
            color: var(--gold);
        }

        .subfolder-content {
            display: none;
            margin-top: 0.4rem;
            padding-left: 1rem;
            border-left: 1px solid var(--border-light);
        }

        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0;
            border-bottom: 1px dotted var(--border-light);
            font-size: 0.9rem;
        }

        .file-item .name {
            flex: 1;
            color: var(--text);
            font-weight: 400;
        }

        .file-item .name::before {
            content: '— ';
            color: var(--green);
        }

        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
            transition: all 0.2s;
            background: transparent;
            white-space: nowrap;
        }

        .download-link:hover {
            background: var(--green);
            color: var(--white);
        }

        .empty-message { color: var(--text-light); font-style: italic; padding: 0.4rem 0; font-size: 0.9rem; }
        .loading { text-align: center; color: var(--text-light); padding: 1rem; font-style: italic; }
        .note {
            margin-top: 2rem;
            font-style: italic;
            color: var(--text-light);
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-light);
            padding-top: 1.5rem;
        }

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--green);
            color: var(--green);
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            line-height: 1;
        }

        .theme-toggle:hover {
            background: var(--green);
            color: var(--white);
            border-color: var(--green);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="День / Ночь" onclick="toggleTheme()">◐</button>

    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>
        
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск по файлам и папкам..." oninput="filterLibrary()">
        <div class="search-info" id="searchInfo"></div>

        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
        <p class="note">Добавьте файл или папку на Google Диск — и они появятся здесь автоматически.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnjiqKWznABpb_vB9os9kR8P-8Df3-AEH-KFjdVX1NLje3Svu9COWTdzZ1HPPOkj3CIw/exec';

        const sectionDescriptions = {
            '1. Проектная документация (технология)': 'Шаблоны для создания графической и текстовой документации : чертежи общего вида, монтировочная опись, лист развески',
            '2. Проектная документация (свет)': 'LightPlot, системы управления, элементы электробутафории',
            '3. Рабочая документация': 'Стандартные изделия, механика',
            '4. Гастрольная документация': 'Технический райдер, распределение груза',
            '5. Расчёт театральных конструкций': 'Расчёты ферм, станков, лестниц, каркасов',
            '6. 3D-моделирование и визуализация': 'Аддоны для Blender и Cinema-4D',
            '7. Организация театрального дела': 'Сметы по спектаклям, нормативные документы'
        };

        function naturalSort(a, b) {
            return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        }

        function toggleElement(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active');
        }

        function renderFiles(files) {
            if (!files.length) return '';
            const sorted = [...files].sort(naturalSort);
            return sorted.map(f => `
                <div class="file-item" data-filename="${f.name.toLowerCase()}">
                    <span class="name">${f.name}</span>
                    <a href="${f.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            
            let inner = '';
            
            (section.folders || []).forEach((sub, si) => {
                const subId = 'sub-' + index + '-' + si;
                inner += `
                    <div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')" data-foldername="${sub.name.toLowerCase()}">
                        <h3>${sub.name}</h3>
                        <div id="${subId}" class="subfolder-content">
                            ${renderFiles(sub.files || [])}
                        </div>
                    </div>
                `;
            });
            
            inner += renderFiles(section.files || []);
            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';

            return `
                <div class="section" onclick="toggleElement('${sectionId}')" data-sectionname="${section.name.toLowerCase()}">
                    <h2>${section.name}</h2>
                    <p class="desc">${desc}</p>
                    <div id="${sectionId}" class="section-content">${inner}</div>
                </div>
            `;
        }

        function filterLibrary() {
            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            const sections = document.querySelectorAll('.section');
            const searchInfo = document.getElementById('searchInfo');
            let visibleCount = 0;

            sections.forEach(section => {
                if (!query) {
                    section.style.display = '';
                    section.querySelectorAll('.file-item, .subfolder').forEach(el => el.style.display = '');
                    searchInfo.textContent = '';
                    return;
                }

                const sectionName = section.getAttribute('data-sectionname') || '';
                const fileItems = section.querySelectorAll('.file-item');
                const subfolders = section.querySelectorAll('.subfolder');
                
                let sectionVisible = sectionName.includes(query);
                let hasVisibleFiles = false;

                fileItems.forEach(item => {
                    const filename = item.getAttribute('data-filename') || '';
                    if (filename.includes(query) || sectionName.includes(query)) {
                        item.style.display = '';
                        hasVisibleFiles = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                subfolders.forEach(sub => {
                    const folderName = sub.getAttribute('data-foldername') || '';
                    const subFiles = sub.querySelectorAll('.file-item');
                    let subHasVisible = folderName.includes(query);

                    subFiles.forEach(item => {
                        const filename = item.getAttribute('data-filename') || '';
                        if (filename.includes(query) || folderName.includes(query) || sectionName.includes(query)) {
                            item.style.display = '';
                            subHasVisible = true;
                        } else {
                            item.style.display = 'none';
                        }
                    });

                    sub.style.display = subHasVisible ? '' : 'none';
                    if (subHasVisible) hasVisibleFiles = true;
                });

                if (hasVisibleFiles || sectionVisible) {
                    section.style.display = '';
                    visibleCount++;
                } else {
                    section.style.display = 'none';
                }
            });

            if (query) {
                searchInfo.textContent = visibleCount > 0 ? `Найдено в ${visibleCount} разделах` : 'Ничего не найдено';
            } else {
                searchInfo.textContent = '';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) {
                btn.textContent = '◑';
                localStorage.setItem('theme', 'dark');
            } else {
                btn.textContent = '◐';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const saved = localStorage.getItem('theme');
            const btn = document.getElementById('themeToggle');
            if (saved === 'dark') {
                document.body.classList.add('dark');
                btn.textContent = '◑';
            } else {
                btn.textContent = '◐';
            }
        }

        function loadLibrary() {
            const container = document.getElementById('sections-container');
            const callbackName = 'jsonp_callback_' + Date.now();
            
            const timeout = setTimeout(function() {
                container.innerHTML = '<div class="loading">Превышено время ожидания. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            }, 15000);
            
            window[callbackName] = function(sections) {
                clearTimeout(timeout);
                if (!sections || !sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены. Проверьте структуру Google Диска.</div>';
                    delete window[callbackName];
                    return;
                }
                container.innerHTML = sections.map((s, i) => renderSection(s, i)).join('');
                delete window[callbackName];
            };

            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?callback=' + callbackName;
            script.onerror = function() {
                clearTimeout(timeout);
                container.innerHTML = '<div class="loading">Ошибка загрузки. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            };
            document.body.appendChild(script);
        }

        loadTheme();
        setTimeout(loadLibrary, 300);
    </script>
</body>
</html>
