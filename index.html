<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #125c5f;
            --green-dark: #0d4547;
            --green-light: #1a7a7e;
            --green-lighter: #208f94;
            --green-bg: #f5f9f9;
            --gold: #b8a57a;
            --gold-light: #d4c9a8;
            --paper: #fdfaf5;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: #f5f2eb;
            /* Фон — симметричные линии сцены, расходящиеся от центра */
            background-image:
                /* Горизонтальные линии */
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(18, 92, 95, 0.08) 39px, rgba(18, 92, 95, 0.08) 40px),
                repeating-linear-gradient(0deg, transparent, transparent 119px, rgba(18, 92, 95, 0.12) 119px, rgba(18, 92, 95, 0.12) 120px),
                /* Вертикальные линии — расходятся от центра */
                repeating-linear-gradient(90deg, transparent 0px, transparent 199px, rgba(18, 92, 95, 0.06) 199px, rgba(18, 92, 95, 0.06) 200px, transparent 200px, transparent 399px, rgba(18, 92, 95, 0.06) 399px, rgba(18, 92, 95, 0.06) 400px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 49px, rgba(18, 92, 95, 0.04) 49px, rgba(18, 92, 95, 0.04) 50px, transparent 50px, transparent 349px, rgba(18, 92, 95, 0.04) 349px, rgba(18, 92, 95, 0.04) 350px),
                /* Диагонали — зеркальные от центра */
                linear-gradient(135deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%),
                linear-gradient(45deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%);
            background-size: 400px 200px;
            background-position: center top;
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--white);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--green);
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--gold-light);
        }

        .section {
            background: transparent;
            border: none;
            border-left: 3px solid var(--green);
            border-radius: 0;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }

        .section:hover {
            background: #f9fbfb;
            border-left-color: var(--green-light);
        }

        .section h2 {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.6px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .section h2::before {
            content: '▸';
            color: var(--green);
            font-size: 1rem;
            font-weight: 400;
        }

        .section .desc {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 0.15rem;
            font-weight: 400;
        }

        .section-content {
            display: none;
            margin-top: 0.8rem;
            padding-left: 1.2rem;
            border-left: 1px solid var(--gold-light);
        }

        .section-content.active { display: block; }

        .subfolder {
            background: transparent;
            border: none;
            border-left: 2px solid var(--gold);
            border-radius: 0;
            padding: 0.6rem 0.8rem;
            margin: 0.3rem 0;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }

        .subfolder:hover {
            background: #fdfdfb;
            border-left-color: var(--green);
        }

        .subfolder h3 {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text);
        }

        .subfolder h3::before {
            content: '▹ ';
            color: var(--gold);
        }

        .subfolder-content {
            display: none;
            margin-top: 0.4rem;
            padding-left: 1rem;
            border-left: 1px solid rgba(184, 165, 122, 0.3);
        }

        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0;
            border-bottom: 1px dotted rgba(184, 165, 122, 0.3);
            font-size: 0.9rem;
        }

        .file-item .name {
            flex: 1;
            color: var(--text);
            font-weight: 400;
        }

        .file-item .name::before {
            content: '— ';
            color: var(--green);
        }

        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
            transition: all 0.2s;
            background: transparent;
        }

        .download-link:hover {
            background: var(--green);
            color: var(--white);
        }

        .empty-message { color: var(--text-light); font-style: italic; padding: 0.4rem 0; font-size: 0.9rem; }
        .loading { text-align: center; color: var(--text-light); padding: 1rem; font-style: italic; }
        .note {
            margin-top: 2rem;
            font-style: italic;
            color: var(--text-light);
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid rgba(184, 165, 122, 0.3);
            padding-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>
        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
        <p class="note">Добавьте файл или папку на Google Диск — и они появятся здесь автоматически.</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnjiqKWznABpb_vB9os9kR8P-8Df3-AEH-KFjdVX1NLje3Svu9COWTdzZ1HPPOkj3CIw/exec';

        const sectionDescriptions = {
            '1. Проектная документация (технология)': 'Шаблоны для создания графической и текстовой документации : чертежи общего вида, монтировочная опись, лист развески',
            '2. Проектная документация (свет)': 'LightPlot, системы управления, элементы электробутафории',
            '3. Рабочая документация': 'Стандартные изделия, механика',
            '4. Гастрольная документация': 'Технический райдер, распределение груза',
            '5. Расчёт театральных конструкций': 'Расчёты ферм, станков, лестниц, каркасов',
            '6. 3D-моделирование и визуализация': 'Аддоны для Blender и Cinema-4D',
            '7. Организация театрального дела': 'Сметы по спектаклям, нормативные документы'
        };

        function toggleElement(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('active');
        }

        function renderFiles(files) {
            if (!files.length) return '<div class="empty-message">Нет файлов</div>';
            return files.map(f => `
                <div class="file-item">
                    <span class="name">${f.name}</span>
                    <a href="${f.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            
            let inner = '';
            
            (section.folders || []).forEach((sub, si) => {
                const subId = 'sub-' + index + '-' + si;
                inner += `
                    <div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')">
                        <h3>${sub.name}</h3>
                        <div id="${subId}" class="subfolder-content">
                            ${renderFiles(sub.files || [])}
                        </div>
                    </div>
                `;
            });
            
            inner += renderFiles(section.files || []);

            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';

            return `
                <div class="section" onclick="toggleElement('${sectionId}')">
                    <h2>${section.name}</h2>
                    <p class="desc">${desc}</p>
                    <div id="${sectionId}" class="section-content">${inner}</div>
                </div>
            `;
        }

        function loadLibrary() {
            const container = document.getElementById('sections-container');
            const callbackName = 'jsonp_callback_' + Date.now();
            
            const timeout = setTimeout(function() {
                container.innerHTML = '<div class="loading">Превышено время ожидания. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            }, 15000);
            
            window[callbackName] = function(sections) {
                clearTimeout(timeout);
                if (!sections || !sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены.</div>';
                    delete window[callbackName];
                    return;
                }
                container.innerHTML = sections.map((s, i) => renderSection(s, i)).join('');
                delete window[callbackName];
            };

            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?callback=' + callbackName;
            script.onerror = function() {
                clearTimeout(timeout);
                container.innerHTML = '<div class="loading">Ошибка загрузки. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            };
            document.body.appendChild(script);
        }

        setTimeout(loadLibrary, 300);
    </script>
</body>
</html>
