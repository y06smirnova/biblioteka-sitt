<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека факультета Сценографии и Театральной технологии</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #125c5f;
            --green-dark: #0d4547;
            --green-light: #1a7a7e;
            --green-lighter: #208f94;
            --gold: #b8a57a;
            --gold-light: #d4c9a8;
            --text: #2c2c2c;
            --text-light: #5c5c5c;
            --white: #ffffff;
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --section-hover: #f9fbfb;
            --border-light: rgba(184, 165, 122, 0.3);
            --correct: #2e7d32;
            --wrong: #c62828;
        }

        body.dark {
            --green: #208f94;
            --green-dark: #1a7a7e;
            --green-light: #125c5f;
            --green-lighter: #28a0a5;
            --gold: #9e8b5c;
            --gold-light: #6b5d3e;
            --text: #e0dcd0;
            --text-light: #b0a890;
            --white: #1e1e1e;
            --bg: #151515;
            --card-bg: #1e1e1e;
            --section-hover: #252525;
            --border-light: rgba(158, 139, 92, 0.3);
            --correct: #4caf50;
            --wrong: #ef5350;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            background-color: var(--bg);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(18, 92, 95, 0.08) 39px, rgba(18, 92, 95, 0.08) 40px),
                repeating-linear-gradient(0deg, transparent, transparent 119px, rgba(18, 92, 95, 0.12) 119px, rgba(18, 92, 95, 0.12) 120px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 199px, rgba(18, 92, 95, 0.06) 199px, rgba(18, 92, 95, 0.06) 200px, transparent 200px, transparent 399px, rgba(18, 92, 95, 0.06) 399px, rgba(18, 92, 95, 0.06) 400px),
                repeating-linear-gradient(90deg, transparent 0px, transparent 49px, rgba(18, 92, 95, 0.04) 49px, rgba(18, 92, 95, 0.04) 50px, transparent 50px, transparent 349px, rgba(18, 92, 95, 0.04) 349px, rgba(18, 92, 95, 0.04) 350px),
                linear-gradient(135deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%),
                linear-gradient(45deg, transparent 49.7%, rgba(18, 92, 95, 0.04) 49.7%, rgba(18, 92, 95, 0.04) 50.3%, transparent 50.3%);
            background-size: 400px 200px;
            background-position: center top;
            padding: 2rem;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            padding: 2.5rem 2.2rem;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .container::before {
            content: '';
            display: block;
            height: 2px;
            background: var(--green);
            margin-bottom: 2rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--green);
            margin-bottom: 0.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--gold-light);
        }

        .search-box {
            width: 100%;
            padding: 0.5rem 0.8rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.95rem;
            border: 1px solid var(--green);
            border-radius: 3px;
            background: transparent;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box::placeholder { color: var(--text-light); font-style: italic; }
        .search-box:focus { border-color: var(--green-light); }
        .search-info { color: var(--text-light); font-size: 0.8rem; margin-bottom: 0.8rem; font-style: italic; min-height: 1rem; }

        .section {
            background: transparent;
            border: none;
            border-left: 3px solid var(--green);
            border-radius: 0;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            box-shadow: none;
        }
        .section:hover { background: var(--section-hover); border-left-color: var(--green-light); }
        .section h2 {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.6px;
            color: var(--green-dark);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .section h2::before { content: '▸'; color: var(--green); font-size: 1rem; }
        .section .desc { color: var(--text-light); font-size: 0.9rem; margin-top: 0.15rem; }
        .section-content { display: none; margin-top: 0.8rem; padding-left: 1.2rem; border-left: 1px solid var(--gold-light); }
        .section-content.active { display: block; }

        .subfolder {
            background: transparent;
            border: none;
            border-left: 2px solid var(--gold);
            border-radius: 0;
            padding: 0.6rem 0.8rem;
            margin: 0.3rem 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .subfolder:hover { background: #fdfdfb; }
        .subfolder h3 { font-size: 1rem; font-weight: 400; color: var(--text); }
        .subfolder h3::before { content: '▹ '; color: var(--gold); }
        .subfolder-content { display: none; margin-top: 0.4rem; padding-left: 1rem; border-left: 1px solid var(--border-light); }
        .subfolder-content.active { display: block; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0;
            border-bottom: 1px dotted var(--border-light);
            font-size: 0.9rem;
        }
        .file-item .name { flex: 1; color: var(--text); }
        .file-item .name::before { content: '— '; color: var(--green); }
        .download-link {
            color: var(--green);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 3px 10px;
            border: 1px solid var(--green);
            border-radius: 3px;
            transition: all 0.2s;
            background: transparent;
            white-space: nowrap;
        }
        .download-link:hover { background: var(--green); color: var(--white); }
        .empty-message { color: var(--text-light); font-style: italic; padding: 0.4rem 0; font-size: 0.9rem; }
        .loading { text-align: center; color: var(--text-light); padding: 1rem; font-style: italic; }

        .corner-btn {
            position: fixed;
            bottom: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--green);
            color: var(--green);
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            line-height: 1;
        }
        .corner-btn:hover { background: var(--green); color: var(--white); }
        .theme-toggle { right: 2rem; }
        .game-btn { left: 2rem; font-size: 0.8rem; font-weight: 700; width: auto; padding: 0 1rem; border-radius: 20px; }

        .game-panel {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .game-panel.active { display: flex; }
        .game-content {
            background: var(--card-bg);
            border-radius: 6px;
            padding: 1.5rem;
            width: 95%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            color: var(--text);
            text-align: center;
        }
        .game-close {
            position: absolute;
            top: 0.5rem; right: 1rem;
            background: none; border: none;
            font-size: 1.5rem; cursor: pointer;
            color: var(--text-light);
        }
        .game-close:hover { color: var(--text); }
        .game-content h2 { font-size: 1.3rem; font-weight: 400; color: var(--green); margin-bottom: 0.5rem; }
        .game-image { max-width: 100%; max-height: 250px; border-radius: 4px; border: 1px solid var(--border-light); margin-bottom: 1rem; }
        .game-question { font-size: 1rem; margin-bottom: 0.8rem; color: var(--text); }
        .game-options {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.8rem;
        }
        .game-option {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border: 1px solid var(--green);
            border-radius: 3px;
            background: transparent;
            color: var(--green);
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }
        .game-option:hover { background: var(--green); color: var(--white); }
        .game-option.correct { background: var(--correct); color: var(--white); border-color: var(--correct); }
        .game-option.wrong { background: var(--wrong); color: var(--white); border-color: var(--wrong); }
        .game-option:disabled { pointer-events: none; opacity: 0.7; }
        .game-score { font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem; }
        .game-next {
            font-family: 'PT Sans Narrow', 'Arial Narrow', sans-serif;
            font-size: 0.9rem;
            padding: 0.5rem 1.5rem;
            background: var(--green);
            color: var(--white);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
        }
        .game-next:hover { background: var(--green-lighter); }
        .game-next.show { display: inline-block; }
    </style>
</head>
<body>
    <button class="corner-btn theme-toggle" id="themeToggle" title="День / Ночь" onclick="toggleTheme()">◐</button>
    <button class="corner-btn game-btn" id="gameBtn" title="Угадай соединение" onclick="toggleGame()">🔧 Угадай соединение</button>

    <div class="game-panel" id="gamePanel">
        <div class="game-content">
            <button class="game-close" onclick="toggleGame()">×</button>
            <h2>Угадай соединение</h2>
            <div id="gameContainer"><p>Загрузка игры...</p></div>
        </div>
    </div>

    <div class="container">
        <h1>Библиотека факультета Сценографии и Театральной технологии</h1>
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск по файлам и папкам..." oninput="filterLibrary()">
        <div class="search-info" id="searchInfo"></div>
        <div id="sections-container"><div class="loading">Загрузка библиотеки...</div></div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnjiqKWznABpb_vB9os9kR8P-8Df3-AEH-KFjdVX1NLje3Svu9COWTdzZ1HPPOkj3CIw/exec';

        const sectionDescriptions = {
            '1. Проектная документация (технология)': 'Шаблоны для создания графической и текстовой документации : чертежи общего вида, монтировочная опись, лист развески',
            '2. Проектная документация (свет)': 'LightPlot, системы управления, элементы электробутафории',
            '3. Рабочая документация': 'Стандартные изделия, механика',
            '4. Гастрольная документация': 'Технический райдер, распределение груза',
            '5. Расчёт театральных конструкций': 'Расчёты ферм, станков, лестниц, каркасов',
            '6. 3D-моделирование и визуализация': 'Аддоны для Blender и Cinema-4D',
            '7. Организация театрального дела': 'Сметы по спектаклям, нормативные документы'
        };

        function naturalSort(a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }); }
        function toggleElement(id) { const el = document.getElementById(id); if (el) el.classList.toggle('active'); }

        function renderFiles(files) {
            if (!files.length) return '';
            const sorted = [...files].sort(naturalSort);
            return sorted.map(f => `
                <div class="file-item" data-filename="${f.name.toLowerCase()}">
                    <span class="name">${f.name}</span>
                    <a href="${f.url}" class="download-link" target="_blank">Скачать</a>
                </div>
            `).join('');
        }

        function renderSection(section, index) {
            const sectionId = 'section-' + index;
            const desc = sectionDescriptions[section.name] || 'Материалы раздела.';
            let inner = '';
            (section.folders || []).forEach((sub, si) => {
                const subId = 'sub-' + index + '-' + si;
                inner += `<div class="subfolder" onclick="event.stopPropagation(); toggleElement('${subId}')" data-foldername="${sub.name.toLowerCase()}"><h3>${sub.name}</h3><div id="${subId}" class="subfolder-content">${renderFiles(sub.files || [])}</div></div>`;
            });
            inner += renderFiles(section.files || []);
            if (!inner) inner = '<div class="empty-message">Раздел пуст</div>';
            return `<div class="section" onclick="toggleElement('${sectionId}')" data-sectionname="${section.name.toLowerCase()}"><h2>${section.name}</h2><p class="desc">${desc}</p><div id="${sectionId}" class="section-content">${inner}</div></div>`;
        }

        function filterLibrary() {
            const query = document.getElementById('searchBox').value.toLowerCase().trim();
            const sections = document.querySelectorAll('.section');
            const searchInfo = document.getElementById('searchInfo');
            let visibleCount = 0;
            sections.forEach(section => {
                if (!query) {
                    section.style.display = '';
                    section.querySelectorAll('.file-item, .subfolder').forEach(el => el.style.display = '');
                    searchInfo.textContent = '';
                    return;
                }
                const sectionName = section.getAttribute('data-sectionname') || '';
                const fileItems = section.querySelectorAll('.file-item');
                const subfolders = section.querySelectorAll('.subfolder');
                let hasVisibleFiles = false;
                fileItems.forEach(item => {
                    const filename = item.getAttribute('data-filename') || '';
                    if (filename.includes(query) || sectionName.includes(query)) { item.style.display = ''; hasVisibleFiles = true; }
                    else { item.style.display = 'none'; }
                });
                subfolders.forEach(sub => {
                    const folderName = sub.getAttribute('data-foldername') || '';
                    const subFiles = sub.querySelectorAll('.file-item');
                    let subHasVisible = folderName.includes(query);
                    subFiles.forEach(item => {
                        const filename = item.getAttribute('data-filename') || '';
                        if (filename.includes(query) || folderName.includes(query) || sectionName.includes(query)) { item.style.display = ''; subHasVisible = true; }
                        else { item.style.display = 'none'; }
                    });
                    sub.style.display = subHasVisible ? '' : 'none';
                    if (subHasVisible) hasVisibleFiles = true;
                });
                if (hasVisibleFiles || sectionName.includes(query)) { section.style.display = ''; visibleCount++; }
                else { section.style.display = 'none'; }
            });
            searchInfo.textContent = query ? (visibleCount > 0 ? `Найдено в ${visibleCount} разделах` : 'Ничего не найдено') : '';
        }

        function loadLibrary() {
            const container = document.getElementById('sections-container');
            const callbackName = 'jsonp_callback_' + Date.now();
            const timeout = setTimeout(() => {
                container.innerHTML = '<div class="loading">Превышено время ожидания. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            }, 15000);
            window[callbackName] = function(sections) {
                clearTimeout(timeout);
                if (!sections || !sections.length) {
                    container.innerHTML = '<div class="loading">Папки не найдены.</div>';
                    delete window[callbackName];
                    return;
                }
                container.innerHTML = sections.map((s, i) => renderSection(s, i)).join('');
                delete window[callbackName];
            };
            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?callback=' + callbackName;
            script.onerror = () => {
                clearTimeout(timeout);
                container.innerHTML = '<div class="loading">Ошибка загрузки. <a href="javascript:location.reload()" style="color:var(--green);">Обновить</a></div>';
                delete window[callbackName];
            };
            document.body.appendChild(script);
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) { btn.textContent = '◑'; localStorage.setItem('theme', 'dark'); }
            else { btn.textContent = '◐'; localStorage.setItem('theme', 'light'); }
        }
        function loadTheme() {
            const saved = localStorage.getItem('theme');
            const btn = document.getElementById('themeToggle');
            if (saved === 'dark') { document.body.classList.add('dark'); btn.textContent = '◑'; }
            else { btn.textContent = '◐'; }
        }

        // ==================== ИГРА ====================
        const classificationMap = {
            'Болтовое':   { integrity: 'Разъёмное', category: 'Резьбовое', subcategory: null },
            'Винтовое':   { integrity: 'Разъёмное', category: 'Резьбовое', subcategory: null },
            'Шпилечное':  { integrity: 'Разъёмное', category: 'Резьбовое', subcategory: null },
            'Шпоночное':  { integrity: 'Разъёмное', category: 'Нерезьбовое', subcategory: null },
            'Штифтовое':  { integrity: 'Разъёмное', category: 'Нерезьбовое', subcategory: null },
            'Зубчатое':   { integrity: 'Разъёмное', category: 'Нерезьбовое', subcategory: null },
            'Клиновое':   { integrity: 'Разъёмное', category: 'Нерезьбовое', subcategory: null },
            'Шплинтовое': { integrity: 'Разъёмное', category: 'Нерезьбовое', subcategory: null },
            'Клеевое':    { integrity: 'Неразъёмное', category: 'Клеевое', subcategory: ['Угловое', 'Серединное', 'Боковое', 'Торцевое'] },
            'Сварное':    { integrity: 'Неразъёмное', category: null, subcategory: null },
            'Клёпаное':   { integrity: 'Неразъёмное', category: null, subcategory: null },
            'Паяное':     { integrity: 'Неразъёмное', category: null, subcategory: null },
            'Сшивное':    { integrity: 'Неразъёмное', category: null, subcategory: null },
            'Посадка с натягом': { integrity: 'Неразъёмное', category: null, subcategory: null }
        };

        let gameData = [];
        let currentQuestion = null;
        let currentStep = 0;
        let scoreTotal = 0;
        let scoreCorrect = 0;
        let answered = false;

        function toggleGame() {
            const panel = document.getElementById('gamePanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                loadGameData();
            }
        }

        function loadGameData() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = '<p>Загрузка игры...</p>';
            
            const callbackName = 'game_callback_' + Date.now();
            
            const timeout = setTimeout(() => {
                container.innerHTML = '<p>Ошибка загрузки игры. <a href="javascript:void(0)" onclick="loadGameData()" style="color:var(--green);">Попробовать ещё раз</a></p>';
                delete window[callbackName];
            }, 15000);
            
            window[callbackName] = function(sections) {
                clearTimeout(timeout);
                if (!sections || !sections.length) {
                    container.innerHTML = '<p>Папка "Игра - соединения" не найдена на Google Диске.</p>';
                    delete window[callbackName];
                    return;
                }
                
                const gameFolder = sections[0];
                gameData = [];
                
                (gameFolder.folders || []).forEach(typeFolder => {
                    const typeName = typeFolder.name;
                    const classInfo = classificationMap[typeName];
                    if (!classInfo) return;
                    
                    (typeFolder.folders || []).forEach(subFolder => {
                        (subFolder.files || []).forEach(file => {
                            gameData.push({
                                name: file.name,
                                url: file.url.replace('/uc?export=download&id=', '/thumbnail?id=') + '&sz=w500',
                                typeName: typeName,
                                subType: subFolder.name,
                                classInfo: classInfo
                            });
                        });
                    });
                    
                    (typeFolder.files || []).forEach(file => {
                        gameData.push({
                            name: file.name,
                            url: file.url.replace('/uc?export=download&id=', '/thumbnail?id=') + '&sz=w500',
                            typeName: typeName,
                            subType: null,
                            classInfo: classInfo
                        });
                    });
                });
                
                if (gameData.length < 2) {
                    container.innerHTML = '<p>Недостаточно файлов для игры. Загрузите больше изображений.</p>';
                    delete window[callbackName];
                    return;
                }
                
                scoreTotal = 0;
                scoreCorrect = 0;
                nextQuestion();
                delete window[callbackName];
            };

            const script = document.createElement('script');
            script.src = SCRIPT_URL + '?mode=game&callback=' + callbackName;
            script.onerror = () => {
                clearTimeout(timeout);
                container.innerHTML = '<p>Ошибка загрузки игры.</p>';
                delete window[callbackName];
            };
            document.body.appendChild(script);
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function nextQuestion() {
            answered = false;
            currentStep = 0;
            const file = gameData[Math.floor(Math.random() * gameData.length)];
            const classInfo = file.classInfo;
            
            const answers = {
                integrity: classInfo.integrity,
                category: classInfo.category,
                typeName: file.typeName,
                subType: file.subType || null,
                fileName: file.name.replace(/\.[^.]+$/, '')
            };
            
            currentQuestion = { file, answers, classInfo };
            renderStep();
        }

        function renderStep() {
            const container = document.getElementById('gameContainer');
            const q = currentQuestion;
            const a = q.answers;
            
            let questionText = '';
            let options = [];
            let correctAnswer = '';
            
            if (currentStep === 0) {
                questionText = 'Какой тип соединения по целостности?';
                options = ['Разъёмное', 'Неразъёмное'];
                correctAnswer = a.integrity;
            } else if (currentStep === 1) {
                if (a.integrity === 'Разъёмное') {
                    questionText = 'Какой тип разъёмного соединения?';
                    options = ['Резьбовое', 'Нерезьбовое'];
                    correctAnswer = a.category;
                } else {
                    questionText = 'Какой тип неразъёмного соединения?';
                    options = ['Клеевое', 'Сварное', 'Клёпаное', 'Паяное', 'Сшивное', 'Посадка с натягом'];
                    correctAnswer = a.category || a.typeName;
                }
            } else if (currentStep === 2) {
                if (a.category === 'Резьбовое') {
                    questionText = 'Какое резьбовое соединение?';
                    options = ['Болтовое', 'Винтовое', 'Шпилечное'];
                    correctAnswer = a.typeName;
                } else if (a.category === 'Нерезьбовое') {
                    questionText = 'Какое нерезьбовое соединение?';
                    options = ['Шпоночное', 'Штифтовое', 'Зубчатое', 'Клиновое', 'Шплинтовое'];
                    correctAnswer = a.typeName;
                } else if (a.category === 'Клеевое') {
                    questionText = 'Какой подтип клеевого соединения?';
                    options = ['Угловое', 'Серединное', 'Боковое', 'Торцевое'];
                    correctAnswer = a.subType;
                }
            } else if (currentStep === 3 || (currentStep === 2 && a.category !== 'Резьбовое' && a.category !== 'Нерезьбовое' && a.category !== 'Клеевое')) {
                questionText = 'Какое название у этого соединения?';
                const correctName = a.fileName;
                const otherNames = gameData
                    .filter(f => f.name !== q.file.name)
                    .map(f => f.name.replace(/\.[^.]+$/, ''));
                const shuffled = shuffle([...new Set(otherNames)]);
                options = shuffle([correctName, ...shuffled.slice(0, 3)]);
                correctAnswer = correctName;
            }
            
            if (!questionText) {
                currentStep++;
                renderStep();
                return;
            }
            
            container.innerHTML = `
                <img src="${q.file.url}" class="game-image" alt="Соединение" onerror="this.style.display='none'">
                <div class="game-score">Вопрос ${scoreTotal + 1} | Правильно: ${scoreCorrect} из ${scoreTotal}</div>
                <div class="game-question">${questionText}</div>
                <div class="game-options" id="gameOptions">
                    ${options.map(opt => `
                        <button class="game-option" onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}', '${correctAnswer.replace(/'/g, "\\'")}')">${opt}</button>
                    `).join('')}
                </div>
                <button class="game-next" id="gameNext" onclick="nextStep()">Дальше</button>
            `;
        }

        function checkAnswer(btn, selected, correct) {
            if (answered) return;
            answered = true;
            scoreTotal++;
            
            const allOptions = document.querySelectorAll('#gameOptions .game-option');
            allOptions.forEach(opt => opt.disabled = true);
            
            if (selected === correct) {
                btn.classList.add('correct');
                scoreCorrect++;
            } else {
                btn.classList.add('wrong');
                allOptions.forEach(opt => {
                    if (opt.textContent === correct) opt.classList.add('correct');
                });
            }
            
            document.getElementById('gameNext').classList.add('show');
        }

        function nextStep() {
            const q = currentQuestion;
            const a = q.answers;
            let isLast = false;
            
            if (currentStep === 0) {
                currentStep = 1;
            } else if (currentStep === 1) {
                currentStep = 2;
            } else if (currentStep === 2) {
                if (a.category === 'Клеевое') {
                    currentStep = 3;
                } else if (a.category === 'Резьбовое' || a.category === 'Нерезьбовое') {
                    currentStep = 3;
                } else {
                    isLast = true;
                }
            } else if (currentStep === 3) {
                isLast = true;
            }
            
            if (isLast) {
                nextQuestion();
            } else {
                renderStep();
            }
        }

        loadTheme();
        setTimeout(loadLibrary, 300);
    </script>
</body>
</html>
